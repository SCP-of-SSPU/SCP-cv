openapi: 3.0.3
info:
  title: SCP-cv REST API
  version: 1.0.0
  license:
    name: Artistic License 2.0
    url: https://opensource.org/license/artistic-2-0
  contact:
    name: SCP-cv 维护团队
  description: |
    SCP-cv 控制台 REST API 文档。

    所有业务路径默认挂载在 `/api` 前缀下；成功响应通常包含 `success: true`，错误响应统一为 `detail + code`。
    业务接口由 Django session cookie 鉴权保护；`/auth/csrf/`、`/auth/login/`、`/auth/logout/` 和 `/auth/me/` 为公开端点。
servers:
  - url: /api
    description: 本机 Django REST API 前缀
  - url: http://127.0.0.1:8000/api
    description: 默认本机后端地址
security:
  - sessionAuth: []
tags:
  - name: auth
    description: 登录、登出、CSRF 与当前用户查询
  - name: folders
    description: 媒体文件夹管理
  - name: sources
    description: 媒体源管理、上传、预览与 PPT 页资源
  - name: sessions
    description: 播放会话查询
  - name: playback
    description: 窗口播放、切换、重置和物理冒烟测试
  - name: background-audio
    description: 背景音乐播放列表、播放控制与状态查询
  - name: runtime
    description: 全局运行态、系统音量与系统关闭请求
  - name: displays
    description: 显示器枚举与窗口显示目标选择
  - name: devices
    description: 外部设备电源控制
  - name: scenarios
    description: 预案创建、编辑、捕获、置顶与激活
  - name: events
    description: Server-Sent Events 播放状态事件流
paths:
  /auth/csrf/:
    get:
      tags:
        - auth
      summary: 获取 CSRF token
      description: |
        显式触发 Django `csrftoken` cookie 下发。前端首次加载时调用一次，之后在不安全方法中把 cookie 值写入 `X-CSRFToken` 请求头。
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: CSRF token 已下发
          headers:
            Set-Cookie:
              description: '`csrftoken` cookie'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/login/:
    post:
      tags:
        - auth
      summary: 登录并建立 Django session
      description: |
        使用用户名和密码登录。登录成功后响应会设置 `sessionid` 与 `csrftoken` cookie，后续业务接口使用该会话访问。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: '`sessionid` 与 `csrftoken` cookie'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/logout/:
    post:
      tags:
        - auth
      summary: 登出并清除当前 session
      description: '该接口幂等；无论是否已有登录态都会返回 `detail: ok`。'
      operationId: logout
      security: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/me/:
    get:
      tags:
        - auth
      summary: 获取当前登录用户
      description: 前端首屏用该接口判断当前浏览器会话是否已登录。
      operationId: getCurrentUser
      security: []
      responses:
        '200':
          description: 已登录用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /folders/:
    get:
      tags:
        - folders
      summary: 获取媒体文件夹列表
      operationId: listFolders
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoldersResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - folders
      summary: 创建媒体文件夹
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /folders/{folder_id}/:
    parameters:
      - $ref: '#/components/parameters/FolderId'
    patch:
      tags:
        - folders
      summary: 更新媒体文件夹
      operationId: updateFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - folders
      summary: 删除媒体文件夹
      operationId: deleteFolder
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/:
    get:
      tags:
        - sources
      summary: 获取媒体源列表
      operationId: listSources
      parameters:
        - in: query
          name: source_type
          schema:
            $ref: '#/components/schemas/SourceType'
          required: false
          description: 按媒体类型筛选
        - in: query
          name: folder_id
          schema:
            type: integer
          required: false
          description: 按文件夹筛选，`-1` 表示根目录
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /sources/upload/:
    post:
      tags:
        - sources
      summary: 上传文件并创建媒体源
      description: 支持 PPT/PPS/POT/ODP、视频、音频和图片等文件。PPT 源默认使用 PowerPoint，并在导入后尝试生成播放专用 `.ppsx`/`.pps` 缓存；宏格式默认导出为非宏 `.ppsx`。
      operationId: uploadSource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                source_type:
                  $ref: '#/components/schemas/SourceType'
                folder_id:
                  type: integer
                  nullable: true
                is_temporary:
                  type: boolean
                preheat_enabled:
                  type: boolean
                  default: true
                  description: 是否在播放器启动时预热该媒体源
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /sources/local/:
    post:
      tags:
        - sources
      summary: 通过本地路径创建媒体源
      description: 本地 PPT/PPS/POT/ODP 文件会默认使用 PowerPoint，并尝试生成播放专用 `.ppsx`/`.pps` 缓存；生成失败不阻断媒体源创建，播放时回退原始文件。
      operationId: addLocalSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalSourceCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /sources/web/:
    post:
      tags:
        - sources
      summary: 通过网页 URL 创建媒体源
      operationId: addWebSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebSourceCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/move/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    patch:
      tags:
        - sources
      summary: 移动媒体源到指定文件夹
      operationId: moveSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveSourceRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/download/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags:
        - sources
      summary: 下载文件型媒体源
      operationId: downloadSource
      responses:
        '200':
          description: 文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/preview/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags:
        - sources
      summary: 获取图片或视频源 inline 预览
      operationId: previewSource
      responses:
        '200':
          description: 图片或视频文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/ppt-resources/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    get:
      tags:
        - sources
      summary: 获取 PPT 页资源
      operationId: listPptResources
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PptResourcesResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    put:
      tags:
        - sources
      summary: 覆盖保存 PPT 页资源
      operationId: replacePptResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PptResourcesReplaceRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PptResourcesResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /sources/{source_id}/:
    parameters:
      - $ref: '#/components/parameters/SourceId'
    patch:
      tags:
        - sources
      summary: 更新媒体源名称、网页 URL、预热开关或 PPT 后端
      operationId: updateSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - sources
      summary: 删除媒体源
      operationId: deleteSource
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /sessions/:
    get:
      tags:
        - sessions
      summary: 获取全部窗口会话快照
      operationId: listSessions
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /sessions/{window_id}/:
    parameters:
      - $ref: '#/components/parameters/WindowId'
    get:
      tags:
        - sessions
      summary: 获取单个窗口会话快照
      operationId: getSession
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /runtime/:
    get:
      tags:
        - runtime
      summary: 获取全局运行状态
      operationId: getRuntimeState
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
        - runtime
      summary: 设置大屏模式
      operationId: updateRuntimeState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeWithSessionsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /volume/:
    get:
      tags:
        - runtime
      summary: 获取系统音量状态
      operationId: getSystemVolume
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemVolumeResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
        - runtime
      summary: 设置系统音量或静音
      operationId: updateSystemVolume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemVolumeUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemVolumeResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/:
    get:
      tags:
        - background-audio
      summary: 获取背景音乐状态
      operationId: getBackgroundAudio
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/playlist/:
    post:
      tags:
        - background-audio
      summary: 添加音频源到背景音乐列表
      operationId: addBackgroundAudioSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackgroundAudioSourceRequest'
      responses:
        '200':
          description: 添加成功或已在列表中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - background-audio
      summary: 清空背景音乐列表
      operationId: clearBackgroundAudioPlaylist
      responses:
        '200':
          description: 清空成功，并停止当前背景音乐
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/playlist/{item_id}/:
    parameters:
      - in: path
        name: item_id
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      tags:
        - background-audio
      summary: 删除背景音乐列表项
      description: 删除当前正在播放的列表项时，后端会自动停止并清空当前背景音乐。
      operationId: removeBackgroundAudioItem
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/playlist/{item_id}/play/:
    parameters:
      - in: path
        name: item_id
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags:
        - background-audio
      summary: 播放背景音乐列表项
      operationId: playBackgroundAudioItem
      responses:
        '200':
          description: 已下发打开并播放指令
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/play-source/:
    post:
      tags:
        - background-audio
      summary: 加入并立即播放音频源
      operationId: playBackgroundAudioSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackgroundAudioSourceRequest'
      responses:
        '200':
          description: 已加入列表并下发播放指令
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/control/:
    post:
      tags:
        - background-audio
      summary: 控制背景音乐播放
      operationId: controlBackgroundAudio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackgroundAudioControlRequest'
      responses:
        '200':
          description: 控制指令已写入后台播放器状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/volume/:
    patch:
      tags:
        - background-audio
      summary: 设置背景音乐音量
      operationId: setBackgroundAudioVolume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackgroundAudioVolumeRequest'
      responses:
        '200':
          description: 音量已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/mute/:
    patch:
      tags:
        - background-audio
      summary: 设置背景音乐静音
      operationId: setBackgroundAudioMute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackgroundAudioMuteRequest'
      responses:
        '200':
          description: 静音状态已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /background-audio/loop/:
    patch:
      tags:
        - background-audio
      summary: 设置背景音乐列表循环
      operationId: setBackgroundAudioLoop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackgroundAudioLoopRequest'
      responses:
        '200':
          description: 循环状态已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundAudioResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /playback/{window_id}/open/:
    parameters:
      - $ref: '#/components/parameters/WindowId'
    post:
      tags:
        - playback
      summary: 打开媒体源到指定窗口
      operationId: openSourceToWindow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSourceRequest'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackStateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /playback/{window_id}/control/:
    parameters:
      - $ref: '#/components/parameters/WindowId'
    post:
      tags:
        - playback
      summary: 播放控制
      operationId: controlPlayback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackControlRequest'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackStateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /playback/{window_id}/navigate/:
    parameters:
      - $ref: '#/components/parameters/WindowId'
    post:
      tags:
        - playback
      summary: 内容导航
      operationId: navigateContent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigateContentRequest'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackStateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /playback/{window_id}/ppt-media/:
    parameters:
      - $ref: '#/components/parameters/WindowId'
    post:
      tags:
        - playback
      summary: 控制 PPT 当前页媒体对象
      operationId: controlPptMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PptMediaControlRequest'
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackStateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /playback/{window_id}/close/:
    parameters:
      - $ref: '#/components/parameters/WindowId'
    post:
      tags:
        - playback
      summary: 关闭指定窗口当前媒体源
      operationId: closeWindowSource
      responses:
        '200':
          description: 操作成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackStateResponse'
        '400':
