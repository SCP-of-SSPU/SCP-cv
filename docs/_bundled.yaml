      summary: 订阅播放状态 SSE 事件流
      operationId: streamEvents
      parameters:
        - in: query
          name: last_id
          required: false
          description: 上次收到的事件序列号，非法值会按 0 处理
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: SSE 数据流
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  id: 12
                  event: playback_state
                  data: {"sessions": [], "background_audio": {"state": {"playback_state": "idle"}, "playlist": []}}
        '401':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Django session cookie。除 auth 白名单外，业务接口需要已登录会话。
  schemas:
    CsrfTokenResponse:
      type: object
      required:
        - csrfToken
      properties:
        csrfToken:
          type: string
          description: Django CSRF token，同时响应会通过 Set-Cookie 写入 `csrftoken`。
          example: x9I3kV7sExampleToken
    ErrorResponse:
      type: object
      required:
        - detail
        - code
      properties:
        detail:
          type: string
          example: 请求体必须是合法 JSON
        code:
          type: string
          example: invalid_json
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          example: admin
        password:
          type: string
          format: password
          minLength: 1
          example: password
    AuthUser:
      type: object
      required:
        - id
        - username
        - is_staff
        - is_superuser
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: admin
        is_staff:
          type: boolean
        is_superuser:
          type: boolean
    AuthUserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
    DetailResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
          example: ok
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
    Folder:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        parent_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
    FoldersResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - folders
          properties:
            folders:
              type: array
              items:
                $ref: '#/components/schemas/Folder'
    FolderCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        parent_id:
          type: integer
          nullable: true
    FolderResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - folder
          properties:
            folder:
              $ref: '#/components/schemas/Folder'
    FolderUpdateRequest:
      type: object
      properties:
        name:
          type: string
        parent_id:
          type: integer
          nullable: true
    SourceType:
      type: string
      enum:
        - ppt
        - video
        - audio
        - image
        - web
        - custom_stream
        - rtsp_stream
        - srt_stream
    MediaSource:
      type: object
      required:
        - id
        - source_type
        - name
        - uri
        - is_available
        - is_temporary
        - metadata
        - keep_alive
        - preheat_enabled
        - preview_url
        - thumbnail_url
        - preview_kind
        - preview_label
        - created_at
      properties:
        id:
          type: integer
        source_type:
          $ref: '#/components/schemas/SourceType'
        name:
          type: string
        uri:
          type: string
        is_available:
          type: boolean
        stream_identifier:
          type: string
          nullable: true
        folder_id:
          type: integer
          nullable: true
        original_filename:
          type: string
        file_size:
          type: integer
        mime_type:
          type: string
        is_temporary:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: |
            媒体源扩展元数据。PPT 源可能包含 `ppt_playback` 字段，记录播放专用 `.ppsx`/`.pps`
            缓存的生成状态、原始扩展名、缓存路径和错误信息；播放时仅在 `status=ready`
            且缓存文件存在时使用该缓存 URI，否则回退原始 `uri`。
        keep_alive:
          type: boolean
          deprecated: true
          description: 旧版保持活跃字段，当前与 preheat_enabled 同步
        preheat_enabled:
          type: boolean
          description: 媒体源预热开关；播放器启动时按源类型提前准备后台资源，PPT 源会按播放 URI 进行源文件级预热
        preview_url:
          type: string
          description: 可嵌入前端缩略位的预览 URL；无真实预览时为空字符串
        thumbnail_url:
          type: string
          description: 缩略图 URL，当前与 preview_url 保持一致
        preview_kind:
          type: string
          enum:
            - image
            - video
            - icon
        preview_label:
          type: string
        created_at:
          type: string
          format: date-time
    SourcesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sources
            - sync_result
          properties:
            sources:
              type: array
              items:
                $ref: '#/components/schemas/MediaSource'
            sync_result:
              type: object
              additionalProperties:
                type: integer
    SourceResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - source
          properties:
            source:
              $ref: '#/components/schemas/MediaSource'
    LocalSourceCreateRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
        name:
          type: string
        source_type:
          $ref: '#/components/schemas/SourceType'
        folder_id:
          type: integer
          nullable: true
        preheat_enabled:
          type: boolean
          default: true
          description: 是否在播放器启动时预热该媒体源
        keep_alive:
          type: boolean
          deprecated: true
          description: 旧字段兼容别名；建议改用 preheat_enabled
    WebSourceCreateRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
        name:
          type: string
        folder_id:
          type: integer
          nullable: true
        preheat_enabled:
          type: boolean
          default: true
          description: 是否在播放器启动时预热该网页源
        keep_alive:
          type: boolean
          deprecated: true
          description: 旧字段兼容别名；建议改用 preheat_enabled
    MoveSourceRequest:
      type: object
      properties:
        folder_id:
          type: integer
          nullable: true
          description: 为空时移动到根目录
    MediaItem:
      type: object
      properties:
        id:
          type: string
        media_index:
          type: integer
        media_type:
          type: string
        type:
          type: string
        name:
          type: string
        target:
          type: string
        shape_id:
          type: string
    PptResource:
      type: object
      required:
        - id
        - source_id
        - page_index
        - slide_image
        - next_slide_image
        - speaker_notes
        - has_media
        - media_items
        - created_at
      properties:
        id:
          type: integer
        source_id:
          type: integer
        page_index:
          type: integer
        slide_image:
          type: string
        next_slide_image:
          type: string
        speaker_notes:
          type: string
        has_media:
          type: boolean
        media_items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        created_at:
          type: string
          format: date-time
    PptResourcesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - resources
          properties:
            resources:
              type: array
              items:
                $ref: '#/components/schemas/PptResource'
    PptResourceInput:
      type: object
      required:
        - page_index
      properties:
        page_index:
          type: integer
          minimum: 1
        slide_image:
          type: string
        speaker_notes:
          type: string
        media_items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
    PptResourcesReplaceRequest:
      type: object
      required:
        - resources
      properties:
        resources:
          type: array
          items:
            $ref: '#/components/schemas/PptResourceInput'
    SourceUpdateRequest:
      type: object
      properties:
        name:
          type: string
        uri:
          type: string
          description: 仅网页源允许通过本接口修改 URL
        preheat_enabled:
          type: boolean
          description: 是否在播放器启动时预热该媒体源
        keep_alive:
          type: boolean
          deprecated: true
          description: 旧字段兼容别名；建议改用 preheat_enabled
    PlaybackState:
      type: string
      enum:
        - idle
        - loading
        - playing
        - paused
        - stopped
        - error
    DisplayMode:
      type: string
      enum:
        - single
        - left_right_splice
    SessionSnapshot:
      type: object
      required:
        - window_id
        - session_id
        - source_name
        - source_type
        - source_type_label
        - source_uri
        - playback_state
        - playback_state_label
        - error_message
        - display_mode
        - display_mode_label
        - target_display_label
        - spliced_display_label
        - is_spliced
        - current_slide
        - total_slides
        - position_ms
        - duration_ms
        - pending_command
        - last_updated_at
        - volume
        - is_muted
        - loop_enabled
      properties:
        window_id:
          type: integer
        session_id:
          type: integer
        source_id:
          type: integer
          nullable: true
        source_name:
          type: string
        source_type:
          type: string
        source_type_label:
          type: string
        source_uri:
          type: string
        playback_state:
          $ref: '#/components/schemas/PlaybackState'
        playback_state_label:
          type: string
        error_message:
          type: string
        display_mode:
          $ref: '#/components/schemas/DisplayMode'
        display_mode_label:
          type: string
        target_display_label:
          type: string
        spliced_display_label:
          type: string
        is_spliced:
          type: boolean
        current_slide:
          type: integer
        total_slides:
          type: integer
        position_ms:
          type: integer
        duration_ms:
          type: integer
        pending_command:
          type: string
          nullable: true
        last_updated_at:
          type: string
          format: date-time
        volume:
          type: integer
          minimum: 0
          maximum: 100
        is_muted:
          type: boolean
        loop_enabled:
          type: boolean
    SessionsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sessions
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSnapshot'
    SessionResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - session
          properties:
            session:
              $ref: '#/components/schemas/SessionSnapshot'
    BigScreenMode:
      type: string
      enum:
        - single
        - double
    RuntimeSnapshot:
      type: object
      required:
        - big_screen_mode
        - volume_level
        - muted_windows
      properties:
        big_screen_mode:
          $ref: '#/components/schemas/BigScreenMode'
        volume_level:
          type: integer
          minimum: 0
          maximum: 100
        muted_windows:
          type: array
          items:
            type: integer
    RuntimeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - runtime
          properties:
            runtime:
              $ref: '#/components/schemas/RuntimeSnapshot'
    RuntimeUpdateRequest:
      type: object
      required:
        - big_screen_mode
      properties:
        big_screen_mode:
          $ref: '#/components/schemas/BigScreenMode'
    BackgroundAudioStateSnapshot:
      type: object
      required:
        - id
        - source_id
        - source_name
        - source_uri
        - source
        - current_item_id
        - playback_state
        - playback_state_label
        - error_message
        - position_ms
        - duration_ms
        - volume
        - is_muted
        - loop_enabled
        - pending_command
        - updated_at
      properties:
        id:
          type: integer
        source_id:
          type: integer
          nullable: true
          description: 当前背景音频源 ID；待机或清空时为 null
        source_name:
          type: string
        source_uri:
          type: string
        source:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MediaSource'
        current_item_id:
          type: integer
          nullable: true
          description: 当前音频源对应的播放列表项 ID
        playback_state:
          $ref: '#/components/schemas/PlaybackState'
        playback_state_label:
          type: string
        error_message:
          type: string
        position_ms:
          type: integer
          format: int64
        duration_ms:
          type: integer
          format: int64
        volume:
          type: integer
          minimum: 0
          maximum: 100
        is_muted:
          type: boolean
        loop_enabled:
          type: boolean
          description: 是否在自然播放到列表末尾后回到首项
        pending_command:
          type: string
          description: 播放器进程尚未消费的后台指令；空字符串表示无指令
          enum:
            - ''
            - open
            - play
            - pause
            - stop
            - seek
            - set_loop
            - set_volume
            - set_mute
        updated_at:
          type: string
          format: date-time
    BackgroundAudioPlaylistItem:
      type: object
      required:
        - id
        - source_id
        - source_name
        - sort_order
        - created_at
        - source
      properties:
        id:
          type: integer
        source_id:
          type: integer
        source_name:
          type: string
        sort_order:
          type: integer
        created_at:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/MediaSource'
    BackgroundAudioSnapshot:
      type: object
      required:
        - state
        - playlist
      properties:
        state:
          $ref: '#/components/schemas/BackgroundAudioStateSnapshot'
        playlist:
          type: array
          items:
            $ref: '#/components/schemas/BackgroundAudioPlaylistItem'
    RuntimeWithSessionsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - runtime
            - sessions
            - background_audio
          properties:
            runtime:
              $ref: '#/components/schemas/RuntimeSnapshot'
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSnapshot'
            background_audio:
              $ref: '#/components/schemas/BackgroundAudioSnapshot'
    SystemVolumeStatus:
      type: object
      required:
        - level
        - muted
        - system_synced
        - backend
      properties:
        level:
          type: integer
          minimum: 0
          maximum: 100
        muted:
          type: boolean
        system_synced:
          type: boolean
        backend:
          type: string
          example: windows_core_audio
    SystemVolumeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - volume
          properties:
            volume:
              $ref: '#/components/schemas/SystemVolumeStatus'
    SystemVolumeUpdateRequest:
      type: object
      properties:
        level:
          type: integer
          minimum: 0
          maximum: 100
        muted:
          type: boolean
    BackgroundAudioResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - background_audio
          properties:
            background_audio:
              $ref: '#/components/schemas/BackgroundAudioSnapshot'
    BackgroundAudioSourceRequest:
      type: object
      required:
        - source_id
      properties:
        source_id:
          type: integer
          minimum: 1
          description: 必须是 audio 类型媒体源 ID
    BackgroundAudioControlRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum:
            - play
            - pause
            - stop
            - next
            - prev
            - seek
        position_ms:
          type: integer
          minimum: 0
          description: action=seek 时使用的目标位置毫秒
    BackgroundAudioVolumeRequest:
      type: object
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 100
          default: 70
    BackgroundAudioMuteRequest:
      type: object
      properties:
        muted:
          type: boolean
          default: false
    BackgroundAudioLoopRequest:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
    OpenSourceRequest:
      type: object
      required:
        - source_id
      properties:
        source_id:
          type: integer
          minimum: 1
          description: 目标媒体源 ID；audio 类型源会被拒绝，请使用背景音乐接口播放
        media_source_id:
          type: integer
          minimum: 1
          description: 兼容旧字段名
        autoplay:
          type: boolean
          default: true
        target_slide:
          type: integer
          minimum: 1
          description: PPT 打开后自动跳转的页码；非 PPT 源忽略
    PlaybackStateResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sessions
            - background_audio
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSnapshot'
            background_audio:
              $ref: '#/components/schemas/BackgroundAudioSnapshot'
    PlaybackAction:
      type: string
      enum:
        - play
        - pause
        - stop
    PlaybackControlRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/PlaybackAction'
    NavigateAction:
      type: string
      enum:
        - next
        - prev
        - goto
        - seek
    NavigateContentRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/NavigateAction'
        target_index:
          type: integer
          description: 当 action=goto 时使用
        position_ms:
          type: integer
          description: 当 action=seek 时使用
    PptMediaControlRequest:
      type: object
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/PlaybackAction'
        media_id:
          type: string
        media_index:
          type: integer
    ToggleLoopRequest:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
    SetWindowVolumeRequest:
      type: object
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
    SetWindowMuteRequest:
      type: object
      properties:
        muted:
          type: boolean
          default: false
    PhysicalSmokeRequest:
      type: object
      properties:
        windows:
          type: array
          description: 要测试的窗口编号，默认 1-4 全部窗口
          items:
            type: integer
            minimum: 1
            maximum: 4
        source_ids:
          type: object
          description: '按媒体源类型显式指定测试源 ID，例如 `{ "audio": 15, "ppt": 16 }`；audio 通过背景音乐通道测试，不打开到窗口'
          additionalProperties:
            type: integer
        settle_seconds:
          type: number
          format: float
          default: 2
          description: 每个源进入播放态后保持播放的秒数
        timeout_seconds:
          type: number
          format: float
          default: 30
          description: 图片、视频、网页和背景音乐等待播放超时
        ppt_timeout_seconds:
          type: number
          format: float
          default: 120
          description: PPT 等待播放超时
        stream_timeout_seconds:
          type: number
          format: float
          default: 45
          description: SRT、RTSP 和自定义流等待播放超时
        total_timeout_seconds:
          type: number
          format: float
          default: 540
          description: 播放阶段全局总超时，后端会限制在 1-540 秒内，超时后不再打开后续源
        reset_after:
          type: boolean
          default: true
          description: 测试结束后是否执行 reset-all
    PhysicalSmokeSummary:
      type: object
      required:
        - total
        - passed
        - failed
      properties:
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
    PhysicalSmokeStepResult:
      type: object
      required:
        - window_id
        - source_type
        - source_id
        - source_name
        - status
        - open_elapsed
        - close_elapsed
        - error_message
        - open_error
        - close_error
      properties:
        window_id:
          type: integer
          description: 1-4 表示物理播放窗口；0 表示背景音乐通道
        source_type:
          $ref: '#/components/schemas/SourceType'
        source_id:
          type: integer
        source_name:
          type: string
        status:
          type: string
          enum:
            - ok
            - failed
        open_elapsed:
          type: number
          format: float
        close_elapsed:
          type: number
          format: float
        error_message:
          type: string
        open_error:
          type: string
        close_error:
          type: string
    PhysicalSmokeResetResult:
      type: object
      required:
        - status
        - elapsed
        - error_message
      properties:
        status:
          type: string
          enum:
            - ok
            - failed
            - skipped
        elapsed:
          type: number
          format: float
        error_message:
          type: string
    PhysicalSmokeResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - started_at
            - finished_at
            - elapsed_seconds
            - total_timeout_seconds
            - windows
            - source_ids
            - summary
            - results
            - reset
            - sessions
          properties:
            started_at:
              type: string
              format: date-time
            finished_at:
              type: string
              format: date-time
            elapsed_seconds:
              type: number
              format: float
            total_timeout_seconds:
              type: number
              format: float
            windows:
              type: array
              items:
                type: integer
            source_ids:
              type: object
              additionalProperties:
                type: integer
            summary:
              $ref: '#/components/schemas/PhysicalSmokeSummary'
            results:
              type: array
              items:
                $ref: '#/components/schemas/PhysicalSmokeStepResult'
            reset:
              $ref: '#/components/schemas/PhysicalSmokeResetResult'
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSnapshot'
    ShutdownResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - sessions
            - detail
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSnapshot'
            detail:
              type: string
              example: 系统关闭请求已发送
    DisplayTarget:
      type: object
      required:
        - index
        - name
        - width
        - height
        - x
        - 'y'
        - is_primary
      properties:
        index:
          type: integer
        name:
          type: string
        width:
          type: integer
        height:
          type: integer
        x:
          type: integer
        'y':
          type: integer
        is_primary:
          type: boolean
    DisplaysResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - targets
            - splice_label
          properties:
            targets:
              type: array
              items:
                $ref: '#/components/schemas/DisplayTarget'
            splice_label:
              type: string
    SelectDisplayRequest:
      type: object
      properties:
        window_id:
          type: integer
          minimum: 1
          maximum: 4
          default: 1
        display_mode:
          $ref: '#/components/schemas/DisplayMode'
        target_label:
          type: string
          description: 单屏模式可省略，省略时由后端选择默认显示器
    DeviceDescriptor:
      type: object
      required:
        - name
        - device_type
        - device_type_label
        - host
        - port
        - action
        - detail
      properties:
        name:
          type: string
        device_type:
          type: string
          enum:
            - splice_screen
            - tv_left
            - tv_right
        device_type_label:
          type: string
        host:
          type: string
        port:
          type: integer
        action:
          type: string
        detail:
          type: string
    DevicesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - devices
          properties:
            devices:
              type: array
              items:
                $ref: '#/components/schemas/DeviceDescriptor'
    DeviceResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - device
          properties:
            device:
              $ref: '#/components/schemas/DeviceDescriptor'
    SourceState:
      type: string
      enum:
        - unset
        - empty
        - set
    ScenarioTarget:
      type: object
      required:
        - window_id
        - source_state
        - autoplay
        - resume
      properties:
        window_id:
          type: integer
          minimum: 1
          maximum: 4
        source_state:
          $ref: '#/components/schemas/SourceState'
        source_id:
          type: integer
          nullable: true
        source_name:
          type: string
        autoplay:
          type: boolean
        resume:
          type: boolean
    Scenario:
      type: object
      required:
        - id
        - name
        - description
        - sort_order
        - big_screen_mode_state
        - big_screen_mode
        - big_screen_mode_label
        - volume_state
        - volume_level
        - targets
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        big_screen_mode_state:
          $ref: '#/components/schemas/SourceState'
        big_screen_mode:
          $ref: '#/components/schemas/BigScreenMode'
        big_screen_mode_label:
          type: string
        volume_state:
          $ref: '#/components/schemas/SourceState'
        volume_level:
          type: integer
          minimum: 0
          maximum: 100
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioTarget'
        window1_source_id:
          type: integer
          nullable: true
        window1_source_name:
          type: string
        window1_autoplay:
          type: boolean
        window1_resume:
          type: boolean
        window2_source_id:
          type: integer
          nullable: true
        window2_source_name:
          type: string
        window2_autoplay:
          type: boolean
        window2_resume:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScenariosResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - scenarios
          properties:
            scenarios:
              type: array
              items:
                $ref: '#/components/schemas/Scenario'
    ScenarioTargetInput:
      type: object
      required:
        - window_id
      properties:
        window_id:
          type: integer
          minimum: 1
          maximum: 4
        source_state:
          $ref: '#/components/schemas/SourceState'
        source_id:
          type: integer
          nullable: true
        autoplay:
          type: boolean
          default: true
        resume:
          type: boolean
          default: true
    ScenarioCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        big_screen_mode_state:
          $ref: '#/components/schemas/SourceState'
        big_screen_mode:
          $ref: '#/components/schemas/BigScreenMode'
        volume_state:
          $ref: '#/components/schemas/SourceState'
        volume_level:
          type: integer
          minimum: 0
          maximum: 100
          default: 100
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioTargetInput'
    ScenarioResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - type: object
          required:
            - scenario
          properties:
            scenario:
              $ref: '#/components/schemas/Scenario'
    ScenarioCaptureRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        scenario_id:
          type: integer
          nullable: true
          description: 传入时覆盖已有预案
    ScenarioUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        big_screen_mode_state:
          $ref: '#/components/schemas/SourceState'
        big_screen_mode:
          $ref: '#/components/schemas/BigScreenMode'
        volume_state:
          $ref: '#/components/schemas/SourceState'
        volume_level:
          type: integer
          minimum: 0
          maximum: 100
        targets:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioTargetInput'
  responses:
    ErrorResponse:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    FolderId:
      in: path
      name: folder_id
      required: true
      schema:
        type: integer
    SourceId:
      in: path
      name: source_id
      required: true
      schema:
        type: integer
    WindowId:
      in: path
      name: window_id
      required: true
      description: 窗口编号，当前有效范围为 1-4
      schema:
        type: integer
        minimum: 1
        maximum: 4
    DeviceType:
      in: path
      name: device_type
      required: true
      schema:
        type: string
        enum:
          - splice_screen
          - tv_left
          - tv_right
    PowerAction:
      in: path
      name: action
      required: true
      schema:
        type: string
        enum:
          - 'on'
          - 'off'
    ScenarioId:
      in: path
      name: scenario_id
      required: true
      schema:
        type: integer
