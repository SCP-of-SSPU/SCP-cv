        - playback
      summary: 重置 PPT 放映后端并恢复页码
      description: 向所有正在放映 PPT 的窗口广播重置指令，关闭当前 PPT 放映窗口与文档，重启所有正在放映的 PPT，并回到重置前页码。
      operationId: resetPptPlayback
      responses:
        '200':
          description: 操作成功
          content:
