type: object
required:
  - window_id
  - session_id
  - source_name
  - source_type
  - source_type_label
  - source_uri
  - playback_state
  - playback_state_label
  - error_message
  - display_mode
  - display_mode_label
  - target_display_label
  - spliced_display_label
  - is_spliced
  - current_slide
  - total_slides
  - position_ms
  - duration_ms
  - pending_command
  - last_updated_at
  - volume
  - is_muted
  - loop_enabled
  - player_online
  - player_last_seen_at
properties:
  window_id:
    type: integer
  session_id:
    type: integer
  source_id:
    type: integer
    nullable: true
  source_name:
    type: string
  source_type:
    type: string
  source_type_label:
    type: string
  source_uri:
    type: string
  playback_state:
    $ref: ./PlaybackState.yaml
  playback_state_label:
    type: string
  error_message:
    type: string
  display_mode:
    $ref: ./DisplayMode.yaml
  display_mode_label:
    type: string
  target_display_label:
    type: string
  spliced_display_label:
    type: string
  is_spliced:
    type: boolean
  current_slide:
    type: integer
  total_slides:
    type: integer
  position_ms:
    type: integer
  duration_ms:
    type: integer
  pending_command:
    type: string
    nullable: true
  last_updated_at:
    type: string
    format: date-time
  volume:
    type: integer
    minimum: 0
    maximum: 100
  is_muted:
    type: boolean
  loop_enabled:
    type: boolean
  player_online:
    type: boolean
    description: 播放器窗口最近 5 秒内是否上报过心跳
  player_last_seen_at:
    type: string
    format: date-time
    nullable: true
    description: 对应窗口播放器最后一次上报心跳的时间
