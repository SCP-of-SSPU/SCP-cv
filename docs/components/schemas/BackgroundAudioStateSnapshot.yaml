type: object
required:
  - id
  - source_id
  - source_name
  - source_uri
  - source
  - current_item_id
  - playback_state
  - playback_state_label
  - error_message
  - position_ms
  - duration_ms
  - volume
  - is_muted
  - loop_enabled
  - pending_command
  - updated_at
properties:
  id:
    type: integer
  source_id:
    type: integer
    nullable: true
    description: 当前背景音频源 ID；待机或清空时为 null
  source_name:
    type: string
  source_uri:
    type: string
  source:
    type: object
    nullable: true
    allOf:
      - $ref: ./MediaSource.yaml
  current_item_id:
    type: integer
    nullable: true
    description: 当前音频源对应的播放列表项 ID
  playback_state:
    $ref: ./PlaybackState.yaml
  playback_state_label:
    type: string
  error_message:
    type: string
  position_ms:
    type: integer
    format: int64
  duration_ms:
    type: integer
    format: int64
  volume:
    type: integer
    minimum: 0
    maximum: 100
  is_muted:
    type: boolean
  loop_enabled:
    type: boolean
    description: 是否在自然播放到列表末尾后回到首项
  pending_command:
    type: string
    readOnly: true
    description: >-
      只读兼容镜像，显示背景音频通道最早的未完成 ControlCommand；空字符串表示当前没有未完成指令。
      新客户端不得把此字段当作命令真值或执行完成证明，最终播放结果应依据 SSE 中持续更新的状态与错误信息。
    enum:
      - ''
      - open
      - play
      - pause
      - stop
      - seek
      - set_loop
      - set_volume
      - set_mute
  updated_at:
    type: string
    format: date-time
