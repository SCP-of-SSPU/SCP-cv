type: object
required:
  - source_id
properties:
  source_id:
    type: integer
    minimum: 1
    description: 目标媒体源 ID；audio 类型源会被拒绝，请使用背景音乐接口播放
  media_source_id:
    type: integer
    minimum: 1
    description: 兼容旧字段名
  autoplay:
    type: boolean
    default: true
  ppt_backend:
    allOf:
      - $ref: ./PptBackend.yaml
    description: 本次打开临时使用的 PPT 后端；不传时使用媒体源默认值，当前新建 PPT 源默认 PowerPoint。
  target_slide:
    type: integer
    minimum: 1
    description: PPT 打开后自动跳转的页码；非 PPT 源忽略
