parameters:
  - $ref: ../components/parameters/SourceId.yaml
patch:
  tags:
    - sources
  summary: 更新媒体源名称、网页 URL、预热开关或 PPT 后端
  operationId: updateSource
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SourceUpdateRequest.yaml
  responses:
    '200':
      description: 更新成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SourceResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
delete:
  tags:
    - sources
  summary: 删除媒体源
  operationId: deleteSource
  responses:
    '200':
      description: 删除成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SuccessResponse.yaml
    '404':
      $ref: ../components/responses/ErrorResponse.yaml
