parameters:
  - $ref: ../components/parameters/SourceId.yaml
patch:
  tags:
    - sources
  summary: 更新媒体源名称、网页 URL、预热开关或 PPT 后端
  operationId: updateSource
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SourceUpdateRequest.yaml
  responses:
    '200':
      description: 更新成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SourceResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
delete:
  tags:
    - sources
  summary: 删除媒体源
  description: >-
    删除当前正在播放的背景音频源时会同时接受一条 STOP 命令；响应 commands 包含其 ID，
    最终状态通过 SSE 中同一 ID 确认。删除非当前源时 commands 为空数组。
  operationId: deleteSource
  responses:
    '200':
      description: 删除完成；可能同时接受背景音频停止命令
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SuccessResponse.yaml
    '404':
      $ref: ../components/responses/ErrorResponse.yaml
