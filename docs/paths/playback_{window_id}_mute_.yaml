patch:
  tags:
    - playback
  summary: 设置窗口静音
  operationId: setWindowMute
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SetWindowMuteRequest.yaml
  responses:
    '200':
      description: 静音设置已持久化并接受；最终播放器状态通过 SSE 会话更新确认
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PlaybackStateResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
