get:
  tags:
    - auth
  summary: 获取 CSRF token
  description: |
    显式触发 Django `csrftoken` cookie 下发。前端首次加载时调用一次，之后在不安全方法中把 cookie 值写入 `X-CSRFToken` 请求头。
  operationId: getCsrfToken
  security: []
  responses:
    '200':
      description: CSRF token 已下发
      headers:
        Set-Cookie:
          description: '`csrftoken` cookie'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CsrfTokenResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
