parameters:
  - $ref: ../components/parameters/WindowId.yaml
post:
  tags:
    - playback
  summary: 播放控制
  operationId: controlPlayback
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PlaybackControlRequest.yaml
  responses:
    '200':
      description: 控制指令已持久化并接受；不表示播放器已执行完成，最终状态通过 SSE 会话更新确认
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PlaybackStateResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
