post:
  tags:
    - background-audio
  summary: 控制背景音乐播放
  operationId: controlBackgroundAudio
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BackgroundAudioControlRequest.yaml
  responses:
    '200':
      description: 背景音频控制指令已持久化并接受；最终播放器状态通过 SSE 更新确认
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BackgroundAudioResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
