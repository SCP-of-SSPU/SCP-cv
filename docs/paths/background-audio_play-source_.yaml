post:
  tags:
    - background-audio
  summary: 加入并立即播放音频源
  operationId: playBackgroundAudioSource
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BackgroundAudioSourceRequest.yaml
  responses:
    '200':
      description: 已加入列表并下发播放指令
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BackgroundAudioResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
