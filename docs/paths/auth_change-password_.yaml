post:
  tags:
    - auth
  summary: 修改当前用户密码
  description: 校验当前密码并应用 Django 密码强度规则；成功后保持当前浏览器会话登录。
  operationId: changePassword
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ChangePasswordRequest.yaml
  responses:
    '200':
      description: 密码修改成功
      content:
        application/json:
          schema:
            type: object
            required:
              - detail
            properties:
              detail:
                type: string
                example: 密码已修改
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
    '401':
      $ref: ../components/responses/ErrorResponse.yaml
