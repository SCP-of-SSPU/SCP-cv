parameters:
  - in: path
    name: item_id
    required: true
    schema:
      type: integer
      minimum: 1
delete:
  tags:
    - background-audio
  summary: 删除背景音乐列表项
  description: 删除当前正在播放的列表项时，后端会自动停止并清空当前背景音乐。
  operationId: removeBackgroundAudioItem
  responses:
    '200':
      description: 删除成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BackgroundAudioResponse.yaml
    '404':
      $ref: ../components/responses/ErrorResponse.yaml
