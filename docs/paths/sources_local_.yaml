post:
  tags:
    - sources
  summary: 通过本地路径创建媒体源
  description: 路径必须位于 `LOCAL_MEDIA_ALLOWED_ROOTS` 配置的目录中。静态演示文稿会尝试转换为 PDF，动态演示文稿使用 PowerPoint。
  operationId: addLocalSource
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LocalSourceCreateRequest.yaml
  responses:
    '201':
      description: 创建成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SourceResponse.yaml
    '400':
      $ref: ../components/responses/ErrorResponse.yaml
