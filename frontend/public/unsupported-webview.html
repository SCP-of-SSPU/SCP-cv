<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>需要更新 Android System WebView</title>
    <style>
      body { margin: 0; padding: 32px 20px; font: 16px/1.6 system-ui, sans-serif; color: #242424; background: #fafafa; }
      main { max-width: 560px; margin: 12vh auto 0; padding: 24px; border: 1px solid #d1d1d1; border-radius: 12px; background: white; }
      h1 { margin-top: 0; font-size: 22px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Android System WebView 版本过旧</h1>
      <p>SCP-cv 控制端需要 Android System WebView 111 或更高版本。请通过设备应用商店或系统更新升级 WebView，然后重新打开应用。</p>
      <p>此页面不能控制播放主机，也不会缓存离线操作。</p>
    </main>
  </body>
</html>
