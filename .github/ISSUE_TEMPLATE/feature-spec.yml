name: 功能规范提案
description: 提交一份可交给 Spec Kit 细化的功能需求
title: "feat: "
labels:
  - enhancement
  - specification
body:
  - type: markdown
    attributes:
      value: |
        感谢提交提案。维护者会将内容整理为 `spec.md`，再进入 clarify → plan → tasks 流程。
  - type: textarea
    id: summary
    attributes:
      label: 功能摘要
      description: 用一句话描述要增加或改变的能力。
      placeholder: 现场操作员可以……
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前痛点、影响范围和为什么现在需要解决。
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: 用户场景
      description: 按“给定……当……那么……”描述主要场景和异常场景。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写出可独立验证的结果，避免描述实现方式。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: 约束与依赖
      description: 设备、端口、权限、兼容性、性能或第三方运行时约束。
  - type: textarea
    id: non-goals
    attributes:
      label: 非目标
      description: 明确本次不包含的内容，帮助控制范围。
  - type: textarea
    id: success
    attributes:
      label: 成功指标
      description: 尽量提供时间、成功率、错误率或现场可观测指标。
